services:
  chatbot:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${DOCKER_PUBLIC_API_URL:-http://localhost:20240}
    init: true
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/runtime/assistant.sqlite3
      VECTOR_INDEX_PATH: /app/runtime/vector_index
      LANGSMITH_TRACING: "false"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:${DOCKER_API_PORT:-20240}:2024"
    volumes:
      - assistant-runtime:/app/runtime
      - assistant-history:/app/.langgraph_api
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2024/ok', timeout=5); urllib.request.urlopen('http://127.0.0.1:3000', timeout=5)"
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

volumes:
  assistant-runtime:
  assistant-history:
