name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --extra runtime --python "${{ matrix.python-version }}"

      - name: Validate demo data
        run: uv run --locked --extra runtime python scripts/validate_demo.py

      - name: Run unit tests
        run: uv run --locked --extra runtime python -m unittest discover -s tests -v

      - name: Check MCP subprocess integration
        run: uv run --locked --extra runtime python scripts/check_mcp.py

  web:
    name: Browser and Agent Server / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install locked server
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --extra web --python 3.12
      - name: Run web boundary and lifecycle tests
        run: uv run --locked --extra web python -m unittest discover -s tests -p test_web.py -v
      - name: Verify disposable Agent Server
        run: uv run --locked --extra web python scripts/check_web.py
      - name: Install pinned UI
        working-directory: ui/agent-chat-ui
        run: npm exec --yes --package=pnpm@10.5.1 -- pnpm install --frozen-lockfile
      - name: Build UI
        working-directory: ui/agent-chat-ui
        run: npm exec --yes --package=pnpm@10.5.1 -- pnpm build
